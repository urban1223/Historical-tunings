<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Historical Tunings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="stage grain">

    <header class="stage-head">
        <a class="back" href="index.html">← All</a>
        <button class="info-btn" id="info-btn" type="button" aria-label="About this temperament">i</button>
        <h1 class="tuning-name" id="tuning-name">—</h1>
        <p class="tuning-note" id="tuning-note"></p>
    </header>

    <div class="rule"></div>

    <section class="gauge">
        <svg id="gauge" viewBox="0 0 300 150" role="img" aria-label="Tuning gauge"></svg>
    </section>

    <section class="readout">
        <div class="note" id="note"></div>
        <span class="cents" id="cents">—</span>
    </section>

    <button class="mic" id="mic-btn"><span class="dot"></span><span id="mic-label">Turn on microphone</span></button>

    <section class="controls">
        <div class="field">
            <label for="a-ref">Reference A</label>
            <input type="number" id="a-ref" value="415" step="0.5" min="350" max="560" inputmode="decimal">
        </div>
        <div class="field">
            <label for="wave-type">Waveform</label>
            <select id="wave-type">
                <option value="triangle" selected>Triangle</option>
                <option value="sine">Sine</option>
                <option value="sawtooth">Sawtooth</option>
            </select>
        </div>
    </section>

    <section class="enharmonics" id="enharmonics"></section>

    <section class="keyboard-wrap">
        <div class="kb-head">
            <span>Swipe to scroll</span>
        </div>
        <div class="kb-scroll" id="kb-scroll">
            <div class="keyboard" id="kb"></div>
        </div>
    </section>

</main>

<div class="sheet" id="sheet" hidden>
    <div class="sheet-plate" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-head">
            <h2 class="sheet-title" id="sheet-title">—</h2>
            <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">✕</button>
        </header>
        <div class="sheet-body" id="sheet-body" tabindex="0"></div>
    </div>
</div>

<script src="tunings.js"></script>
<script src="tuner.js"></script>
</body>
</html>
