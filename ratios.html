<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pure Ratios — Historical Tunings</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b29">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS reads only the prefixed name, so both are needed -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body class="ratios">

<main class="stage grain">

    <header class="stage-head">
        <a class="back" href="index.html?pick=1" data-i18n="all">← All</a>
        <h1 class="tuning-name">Pure Ratios</h1>
        <p class="tuning-note" data-i18n="pureRatiosNote">Build a whole-number ratio, hear it against a root, and see where it falls
        between the keys.</p>
    </header>

    <div class="rule"></div>

    <section class="ratio-readout">
        <div class="ratio-figure" id="ratio-figure"></div>
        <div class="ratio-name" id="ratio-name"></div>
        <div class="ratio-facts" id="ratio-facts"></div>
    </section>

    <section class="harm-picker">
        <div class="harm-row">
            <span class="harm-label" data-i18n="upperHarmonic">Upper harmonic</span>
            <div class="harm-grid" id="harm-num"></div>
        </div>
        <div class="harm-row">
            <span class="harm-label" data-i18n="lowerHarmonic">Lower harmonic</span>
            <div class="harm-grid" id="harm-den"></div>
        </div>
    </section>

    <section class="voice-row">
        <span class="harm-label" data-i18n="soundUpper">Sound the upper note as</span>
        <div class="enh-pair" id="voice-pick">
            <button class="enh-btn active" type="button" data-voice="pure">
                <span class="voice-sys" data-i18n="justIntonation">Just intonation</span>
                <span class="voice-val" id="voice-pure-val">—</span>
                <span class="voice-off">pure</span>
            </button>
            <button class="enh-btn" type="button" data-voice="key">
                <span class="voice-sys" id="voice-key-sys">—</span>
                <span class="voice-val" id="voice-key-val">—</span>
                <span class="voice-off" id="voice-key-off">—</span>
            </button>
        </div>
    </section>

    <button class="sound-btn" id="sound-btn" type="button" data-i18n="play">Play</button>

    <section class="controls">
        <div class="field">
            <label for="root-hz" id="root-hz-label" data-i18n="root">Root</label>
            <!-- Range is the keyboard's own reach, so tapping a key can never leave it -->
            <input type="number" id="root-hz" value="415" step="any" min="16" max="8000" inputmode="decimal">
        </div>
        <div class="field">
            <label for="wave-type" data-i18n="waveform">Waveform</label>
            <!-- Sawtooth first: only a waveform with even harmonics beats at these intervals -->
            <select id="wave-type">
                <option value="sawtooth" selected data-i18n="sawtooth">Sawtooth</option>
                <option value="triangle" data-i18n="triangle">Triangle</option>
                <option value="sine" data-i18n="sine">Sine</option>
            </select>
        </div>
        <div class="field field-wide">
            <label for="tuning-pick" data-i18n="compareAgainst">Compare against</label>
            <select id="tuning-pick"></select>
        </div>
    </section>

    <p class="sheet-note" data-i18n="ratioExact"></p>

    <p class="sheet-note" data-i18n="ratioRoot"></p>

    <p class="sheet-note" data-i18n="ratioKeyboard"></p>

    <p class="sheet-note" data-i18n="ratioIntervals"></p>

    <section class="keyboard-wrap">
        <div class="kb-head">
            <span data-i18n="tapRoot">Tap a key to set the root</span>
        </div>
        <div class="kb-scroll" id="kb-scroll">
            <div class="keyboard" id="kb">
                <div class="kb-marker" id="marker" hidden></div>
            </div>
        </div>
    </section>

</main>

<script src="i18n.js"></script>
<script src="tunings.js"></script>
<script src="ratios.js"></script>
</body>
</html>
