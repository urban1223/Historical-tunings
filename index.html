<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Historical Tunings — Nova Akademija</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b29">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS reads only the prefixed name, so both are needed -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">

<main class="stage grain">

    <header class="masthead">
        <h1>Historical<br>Tunings</h1>
        <p>Association Nova Akademija</p>
    </header>

    <div class="rule"></div>

    <div id="list"></div>

    <footer class="foot">
        <a href="about.html">About &amp; credits</a>
    </footer>

</main>

<script src="tunings.js"></script>
<script>
(function () {
    const list = document.getElementById('list');
    let lastGroup = null;
    TUNINGS.forEach(t => {
        if (t.group !== lastGroup) {
            lastGroup = t.group;
            const h = document.createElement('div');
            h.className = 'group-label';
            h.textContent = t.group;
            list.appendChild(h);
            const wrap = document.createElement('div');
            wrap.className = 'tuning-list';
            wrap.id = 'g-' + t.group;
            list.appendChild(wrap);
        }
        const a = document.createElement('a');
        a.className = 'tuning-link';
        a.href = 'tuner.html?t=' + t.slug;
        a.innerHTML = '<span class="t-name">' + withAccidentals(t.name) + '</span>' +
                      '<span class="t-note">' + t.note + '</span>';
        document.getElementById('g-' + t.group).appendChild(a);
    });
})();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
